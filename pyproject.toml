#:schema https://json.schemastore.org/pyproject.json

[project]
authors = [
  { name = "ONEKEY", email = "support@onekey.com" },
  { name = "Stefan Viehböck", email = "support@onekey.com" },
]
dependencies = [
  "click>=8.1.3,<9",
  "dissect-cstruct>=4.4,<5",
  "lzallright>=0.2.1,<0.3",
]
description = "JFFS2 filesystem extraction tool."
license = "MIT"
license-files = ["LICENSE"]
name = "jefferson"
readme = "README.md"
requires-python = ">=3.10"
version = "0.4.8"

[project.scripts]
jefferson = "jefferson.cli:main"

[dependency-groups]
check = ["pre-commit>=3.5,<5.0", "ruff==0.16.10", "taplo>=0.9.3", "vulture>=2.13"]
dev = [
  { include-group = "check" },
  { include-group = "test" },
  { include-group = "type" },
]
test = ["pytest-cov>=7,<8", "pytest>=8.0.0"]
type = ["pyright>=1.1.349"]

[tool.uv.build-backend]
module-root = ""

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.17,<0.13"]

[tool.pytest.ini_options]
addopts = "--cov"
norecursedirs = """
  *.egg
  *_extract
  .*
  dist
  build
  target
"""

[tool.coverage.run]
branch = true
patch = ["subprocess"] # CLI tests run `python -m jefferson.cli` in a subprocess
source = ["jefferson", "tests"]

[tool.coverage.report]
fail_under = 50 # measured 53% at migration time; ratchet up as tests are added
skip_covered = true

[tool.vulture]
paths = ["jefferson/", "vulture_whitelist.py"]
exclude = []

[tool.pyright]
exclude = [".venv", "build", "vulture_whitelist.py"]
typeCheckingMode = "standard"
